stages:
  - build
  - deploy

variables:
  NODE_VERSION: "22"

build:
  stage: build
  image: node:${NODE_VERSION}
  before_script:
    - npm install -g pnpm
    - pnpm install
  script:
    - pnpm build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  cache:
    paths:
      - node_modules/
      - .pnpm-store/

pages:
  stage: deploy
  image: node:${NODE_VERSION}
  dependencies:
    - build
  script:
    - mkdir -p public
    - cp -r dist/* public/
  artifacts:
    paths:
      - public
  only:
    - main
  environment:
    name: production
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME
